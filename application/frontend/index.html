<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Employee Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container">
        <span class="navbar-brand mb-0 h1">
            ☁ AWS Employee Management System
        </span>
    </div>
</nav>

<div class="container my-5">

    <div class="card shadow-lg border-0">

        <div class="card-header bg-warning text-dark">
            <h4 class="mb-0">Employee Details</h4>
        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Employee ID</label>
                    <input
                        type="text"
                        class="form-control"
                        id="employeeid"
                        placeholder="Enter Employee ID">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Employee Name</label>
                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        placeholder="Enter Employee Name">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Department</label>
                    <input
                        type="text"
                        class="form-control"
                        id="department"
                        placeholder="Enter Department">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Salary</label>
                    <input
                        type="text"
                        class="form-control"
                        id="salary"
                        placeholder="Enter Salary">
                </div>

            </div>

            <div class="d-flex gap-3">

                <button
                    id="saveemployee"
                    class="btn btn-warning w-50">
                    Save Employee
                </button>

                <button
                    id="getemployees"
                    class="btn btn-dark w-50">
                    View Employees
                </button>

            </div>

            <div class="mt-3">
                <span id="EmployeeSaved"></span>
            </div>

        </div>

    </div>

    <div class="card shadow-lg mt-5 border-0">

        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">Employee Records</h4>
        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table
                    class="table table-hover table-bordered align-middle"
                    id="EmployeeTable">

                    <thead class="table-warning">

                    <tr>
                        <th>Employee ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Salary</th>
                    </tr>

                    </thead>

                    <tbody>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<footer class="text-center text-muted mb-3">
    Built using AWS Lambda • API Gateway • DynamoDB • S3 • CloudFront
</footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>

</body>
</html>
